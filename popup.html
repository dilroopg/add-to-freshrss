<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Add to FreshRSS</title>
  <style>
    body {
      width: 320px; margin: 0; padding: 12px; box-sizing: border-box;
      background: #171717; color: #e8e8e8; font: 13px/1.5 system-ui, sans-serif;
    }
    h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; color: #6ea8ff; }
    .brand {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 9px; margin: 0 0 10px; border-radius: 6px;
      background: #101010; border: 1px solid #2c2c2c;
    }
    .brand img.ico { height: 20px; width: auto; display: block; }
    .brand img.ico.wide { height: 16px; }
    .brand .x { color: #6a6a6a; font-size: 12px; }
    .brand .brandtext { margin-left: auto; font-size: 10px; color: #9a9a9a; text-align: right; }
    .brand .brandtext strong { color: #cfcfcf; font-weight: 600; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 0 0 4px; }
    textarea {
      width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical;
      padding: 7px 9px; border-radius: 6px; border: 1px solid #3a3a3a;
      background: #0f0f0f; color: #e8e8e8; font: 12px/1.45 ui-monospace, monospace;
    }
    .hint { color: #8a8a8a; font-size: 11px; margin-top: 4px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    button { padding: 7px 12px; border: 0; border-radius: 6px; font-size: 12px; cursor: pointer; }
    button.primary { background: #0062db; color: #fff; }
    button.primary:hover { background: #1a74e8; }
    button.primary:disabled { background: #2b3a52; color: #7d8ba3; cursor: default; }
    button.ghost { background: #2a2a2a; color: #ddd; }
    button.ghost:hover { background: #383838; }
    #status { font-size: 11px; flex: 1; }
    .ok { color: #6ee7a0; }
    .err { color: #ff8a8a; }
    .sep { border: 0; border-top: 1px solid #2c2c2c; margin: 12px 0 10px; }
    .foot { display: flex; gap: 8px; align-items: center; }
    #mode { font-size: 11px; color: #8a8a8a; flex: 1; }
  </style>
</head>
<body>
  <h1>Add to FreshRSS</h1>

  <div class="brand">
    <img src="assets/firefox.svg" alt="Firefox" class="ico" title="Firefox">
    <span class="x">&rarr;</span>
    <img src="assets/freshrss.svg" alt="FreshRSS" class="ico wide" title="FreshRSS">
    <span class="brandtext">Works with <strong>Firefox</strong> and <strong>Zen</strong></span>
  </div>

  <label for="urls">Paste link(s)</label>
  <textarea id="urls" placeholder="https://example.com/feed/&#10;A feed or site URL you already have &#10;(not a discovery tool)"></textarea>
  <div class="hint">One per line. A site address works too &mdash; FreshRSS finds the feed itself.
    <br><strong>Not for finding feeds</strong> &mdash; this subscribes URLs you already have. To discover
    a site's feeds, use <a href="https://github.com/DIYgod/RSSHub-Radar" target="_blank" rel="noopener">RSSHub Radar</a>.</div>

  <div class="row">
    <button type="button" id="add" class="primary">Add</button>
    <span id="status"></span>
  </div>

  <hr class="sep">

  <div class="foot">
    <span id="mode"></span>
    <button type="button" id="settings" class="ghost">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
